<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoeUVV conecta doadores a entidades e campanhas que precisam de doações.">
  <title>Campanhas | DoeUVV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a href="index.html" class="logo"><span aria-hidden="true">❤️</span> DoeUVV</a>
      <input type="checkbox" id="abrir-menu" class="menu-check">
      <label for="abrir-menu" class="botao-menu"><span aria-hidden="true">☰</span><span class="oculto-visual">Abrir menu</span></label>
      <nav class="menu" aria-label="Menu principal">
        <a href="entidade-necessidades.html">Necessidades</a>
        <a href="entidade-campanhas.html" class="ativo">Campanhas</a>
        <a href="entidade-recebimentos.html">Recebimentos</a>
        <a href="entidade-perfil.html">Perfil</a>
        <span class="usuario" id="nome-usuario"></span>
        <a href="login.html" class="botao-sair">Sair</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>Campanhas da entidade</h1>
      <p class="subtitulo">Divulgue campanhas para arrecadar itens específicos. Cada campanha nova passa pela aprovação do administrador.</p>
      <div class="layout-duplo">
        <form id="form-campanha" class="formulario">
          <h2>Nova campanha</h2>
          <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Ex.: Inverno Solidário" minlength="3" maxlength="60" required>
          </div>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <select id="cidade" required>
              <option value="">Selecione</option>
    <option value="Aracruz">Aracruz</option>
    <option value="Cachoeiro de Itapemirim">Cachoeiro de Itapemirim</option>
    <option value="Cariacica">Cariacica</option>
    <option value="Colatina">Colatina</option>
    <option value="Guarapari">Guarapari</option>
    <option value="Linhares">Linhares</option>
    <option value="São Mateus">São Mateus</option>
    <option value="Serra">Serra</option>
    <option value="Vila Velha">Vila Velha</option>
    <option value="Vitória">Vitória</option>
            </select>
          </div>
          <div class="campo">
            <label for="itens">Itens necessários</label>
            <input type="text" id="itens" placeholder="Ex.: Cobertores, agasalhos" maxlength="120" required>
          </div>
          <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" maxlength="400" required></textarea>
          </div>
          <div class="cartao-botoes">
            <button type="submit" class="botao">Enviar para aprovação</button>
            <button type="reset" class="botao botao-contorno">Limpar</button>
          </div>
        </form>
        <div>
          <h2>Minhas campanhas</h2>
          <div class="tabela-caixa">
            <table>
              <thead>
                <tr>
                  <th>Campanha</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-campanhas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>DoeUVV © 2026 - Desafio Interdisciplinar UVV</p>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/entidade-campanhas.js"></script>
</body>
</html>
