<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoeUVV conecta doadores a entidades e campanhas que precisam de doações.">
  <title>Moderar campanhas | DoeUVV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a href="index.html" class="logo"><span aria-hidden="true">❤️</span> DoeUVV</a>
      <input type="checkbox" id="abrir-menu" class="menu-check">
      <label for="abrir-menu" class="botao-menu"><span aria-hidden="true">☰</span><span class="oculto-visual">Abrir menu</span></label>
      <nav class="menu" aria-label="Menu principal">
        <a href="admin-aprovacoes.html">Aprovar entidades</a>
        <a href="admin-moderacao.html" class="ativo">Moderar campanhas</a>
        <a href="admin-relatorios.html">Relatórios</a>
        <span class="usuario" id="nome-usuario"></span>
        <a href="login.html" class="botao-sair">Sair</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>Moderar campanhas</h1>
      <p class="subtitulo">Aprove, recuse, encerre ou exclua campanhas publicadas na plataforma.</p>
      <form class="filtros" method="get" action="admin-moderacao.html">
        <label for="filtro-status" class="oculto-visual">Status</label>
        <select id="filtro-status" name="status">
          <option value="">Todos os status</option>
          <option value="pendente">Pendentes</option>
          <option value="ativa">Ativas</option>
          <option value="encerrada">Encerradas</option>
          <option value="recusada">Recusadas</option>
        </select>
        <button type="submit" class="botao">Filtrar</button>
      </form>
      <div class="tabela-caixa">
        <table>
          <thead>
            <tr>
              <th>Campanha</th>
              <th>Origem</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-campanhas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>DoeUVV © 2026 - Desafio Interdisciplinar UVV</p>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/admin-moderacao.js"></script>
</body>
</html>
