<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoeUVV conecta doadores a entidades e campanhas que precisam de doações.">
  <title>Perfil da entidade | DoeUVV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="topo-esquerda">
        <button class="botao-voltar" onclick="history.back()" aria-label="Voltar para a página anterior">← Voltar</button>
        <a href="index.html" class="logo"><span aria-hidden="true">❤️</span> DoeUVV</a>
      </div>
      <button class="botao-menu" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>
      <nav id="menu" class="menu" aria-label="Menu principal">
        <a href="entidade-necessidades.html">Necessidades</a>
        <a href="entidade-campanhas.html">Campanhas</a>
        <a href="entidade-recebimentos.html">Recebimentos</a>
        <a href="entidade-perfil.html" class="ativo">Perfil</a>
        <span class="usuario" id="nome-usuario"></span>
        <button class="botao-tema" onclick="trocarTema()" aria-label="Trocar tema claro ou escuro">☾</button>
        <button class="botao-sair" onclick="sair()">Sair</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>Perfil da entidade</h1>
      <p class="subtitulo">Essas informações aparecem na página pública da sua entidade. <a href="#" id="link-publico" class="mensagem-sucesso">Ver página pública</a></p>
      <form id="form-perfil" class="formulario">
        <div class="campos-linha">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
          </div>
          <div class="campo">
            <label for="causa">Causa</label>
            <input type="text" id="causa" required>
          </div>
        </div>
        <div class="campos-linha">
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" required>
          </div>
          <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" maxlength="9">
          </div>
        </div>
        <div class="campo">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco">
        </div>
        <div class="campos-linha">
          <div class="campo">
            <label for="horario">Dias e horário de entrega</label>
            <input type="text" id="horario">
          </div>
          <div class="campo">
            <label for="pix">Chave Pix</label>
            <input type="text" id="pix">
          </div>
        </div>
        <div class="campo">
          <label for="foto">Link da foto</label>
          <input type="text" id="foto">
        </div>
        <div class="campo">
          <label for="historia">Nossa história</label>
          <textarea id="historia"></textarea>
        </div>
        <p id="mensagem-perfil" class="mensagem mensagem-sucesso" role="status"></p>
        <button type="submit" class="botao">Salvar perfil</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>DoeUVV © 2026 - Desafio Interdisciplinar UVV</p>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/entidade-perfil.js"></script>
</body>
</html>
