<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoeUVV conecta doadores a entidades e campanhas que precisam de doações.">
  <title>Registrar doação | DoeUVV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="topo-esquerda">
        <button class="botao-voltar" onclick="history.back()" aria-label="Voltar para a página anterior">← Voltar</button>
        <a href="index.html" class="logo"><span aria-hidden="true">❤️</span> DoeUVV</a>
      </div>
      <button class="botao-menu" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>
      <nav id="menu" class="menu" aria-label="Menu principal">
        <a href="doador-buscar.html">O que doar</a>
        <a href="doador-mapa.html">Mapa de coleta</a>
        <a href="doador-doar.html" class="ativo">Registrar doação</a>
        <a href="doador-doacoes.html">Minhas doações</a>
        <span class="usuario" id="nome-usuario"></span>
        <button class="botao-tema" onclick="trocarTema()" aria-label="Trocar tema claro ou escuro">☾</button>
        <button class="botao-sair" onclick="sair()">Sair</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>Registrar doação</h1>
      <p class="subtitulo">Diga o que você vai doar e como pretende entregar. A entidade confirma quando receber.</p>
      <div class="layout-duplo">
        <form id="form-doacao" class="formulario">
          <div class="campo">
            <label for="entidade">Entidade</label>
            <select id="entidade" required></select>
          </div>
          <div class="campo">
            <label for="item">O que você vai doar</label>
            <input type="text" id="item" list="sugestoes" placeholder="Ex.: Leite em pó" required>
            <datalist id="sugestoes"></datalist>
          </div>
          <div class="campo">
            <label for="quantidade">Quantidade</label>
            <input type="text" id="quantidade" placeholder="Ex.: 5 pacotes" required>
          </div>
          <fieldset>
            <legend>Forma de entrega</legend>
            <label class="opcao"><input type="radio" name="forma" value="Entregar no local" checked> Entregar no local</label>
            <label class="opcao"><input type="radio" name="forma" value="Solicitar coleta"> Solicitar coleta</label>
            <label class="opcao"><input type="radio" name="forma" value="Pix"> Doar em dinheiro (Pix)</label>
          </fieldset>
          <div class="campo">
            <label for="data">Data prevista</label>
            <input type="date" id="data" required>
          </div>
          <p id="mensagem-doacao" class="mensagem mensagem-sucesso" role="status"></p>
          <button type="submit" class="botao">Registrar intenção de doação</button>
        </form>
        <article class="cartao" id="info-entidade"></article>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>DoeUVV © 2026 - Desafio Interdisciplinar UVV</p>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/doador-doar.js"></script>
</body>
</html>
